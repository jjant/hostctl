[package]
name = "hostctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Check whether your NixOS, nix-darwin and home-manager hosts run their flake's current configuration"
license = "MIT"
repository = "https://github.com/jjant/hostctl"
readme = "README.md"
keywords = ["nix", "nixos", "home-manager", "nix-darwin", "tui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await-macro"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "process", "time", "sync", "macros", "io-util", "signal"] }
toml = "1.1.8"
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt", "process", "time", "sync", "macros", "io-util", "signal", "test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3
