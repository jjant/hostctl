name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          kvm: true # for the NixOS VM test (checks.x86_64-linux.vm)
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix flake check -L
