name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # x86_64-linux (with the NixOS VM test), aarch64-linux, aarch64-darwin.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          kvm: true # for the NixOS VM test (checks.x86_64-linux.vm)
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false # the GitHub Actions cache only
      - run: nix flake check -L
